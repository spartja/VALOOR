spring.application.name=valoor
server.port=8080
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:${DB_HOST:localhost}}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:${DB_NAME:valoor}}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:${DB_USERNAME:root}}
spring.datasource.password=${MYSQL_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
valoor.admin.email=${VALOOR_ADMIN_EMAIL:}
valoor.admin.password=${VALOOR_ADMIN_PASSWORD:}
valoor.admin.name=${VALOOR_ADMIN_NAME:Administrador}
